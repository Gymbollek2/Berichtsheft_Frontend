name: Frontend CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

defaults:
  run:
    working-directory: azubi-portal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: azubi-portal/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Unit-Tests
        run: npx ng test --watch=false

      - name: Produktions-Build
        run: npm run build

      - name: Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: azubi-portal
          path: azubi-portal/dist/azubi-portal/browser
