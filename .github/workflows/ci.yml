name: Frontend CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

defaults:
  run:
    working-directory: azubi-portal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: azubi-portal/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Unit-Tests
        id: test
        run: |
          set -o pipefail
          npx ng test --watch=false 2>&1 | tee ../test.log

      - name: Produktions-Build
        id: build
        if: always() && steps.test.conclusion != 'skipped'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../build.log

      - name: Fehler als Annotation ausgeben
        if: failure()
        working-directory: .
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 8000 "$f" | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

      - name: Build hochladen
        uses: actions/upload-artifact@v4
        with:
          name: azubi-portal
          path: azubi-portal/dist/azubi-portal/browser
