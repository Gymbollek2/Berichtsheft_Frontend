<div class="shell" [class.menu-open]="menuOpen()">
  <header class="mobile-bar">
    <button type="button" class="btn btn-icon menu-btn" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-label="Menü">
      <i class="fa-solid" [class.fa-bars]="!menuOpen()" [class.fa-xmark]="menuOpen()"></i>
    </button>
    <img src="assets/fisp-logo.jpg.png" alt="Finanz Informatik Solutions Plus" class="mobile-logo" />
  </header>

  <app-sidebar class="shell-sidebar" />

  <main class="shell-main">
    <div class="topbar no-print">
      <app-benachrichtigungen />
    </div>
    <router-outlet />
  </main>

  <app-bestaetigung-dialog />

</div>
