<div class="login">
  <section class="intro" aria-hidden="true">
    <img src="assets/fisp-logo.jpg.png" alt="" class="company" />
    <div class="intro-text">
      <img src="assets/logo.png" alt="" class="mark" />
      <h1>Azubi-Portal</h1>
      <p>Ausbildungsnachweise digital führen, einreichen und abzeichnen.</p>
    </div>
  </section>

  <section class="form-side">
    <form class="login-form" (ngSubmit)="login()" novalidate>
      <h2>Anmelden</h2>
      <p class="hint mb-4">Mit deinem Benutzernamen und Passwort.</p>

      <label class="form-label" for="user">Benutzername</label>
      <input id="user" class="form-control mb-3" [(ngModel)]="user" name="user" autocomplete="username" autofocus required />

      <label class="form-label" for="password">Passwort</label>
      <div class="input-group mb-4">
        <input
          id="password"
          class="form-control"
          [type]="isPasswordVisible() ? 'text' : 'password'"
          autocomplete="current-password"
          [(ngModel)]="password"
          name="password"
          required
        />
        <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()" [attr.aria-label]="isPasswordVisible() ? 'Passwort verbergen' : 'Passwort anzeigen'">
          <i class="fa-regular" [class.fa-eye]="!isPasswordVisible()" [class.fa-eye-slash]="isPasswordVisible()"></i>
        </button>
      </div>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <button class="btn btn-brand w-100 py-2" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Anmelden
      </button>

      <p class="hint mt-4 mb-0">Passwort vergessen? Wende dich an deine Ausbilderin oder deinen Ausbilder.</p>
    </form>
  </section>
</div>
